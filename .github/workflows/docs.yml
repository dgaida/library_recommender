name: Documentation

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[docs]
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install git-cliff

      - name: Run API Doc Coverage Check (Interrogate)
        run: |
          interrogate -vv .
          interrogate --generate-badge docs/
          mv docs/interrogate_badge.svg docs/interrogate-badge.svg || true

      - name: Generate Changelog (git-cliff)
        run: |
          git-cliff --config cliff.toml --output docs/de/changelog.md
          git-cliff --config cliff.toml --output docs/en/changelog.md

      - name: Markdown Link Check
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          folder-path: 'docs'

      - name: Build and Deploy Documentation (mike)
        if: github.event_name == 'push'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Fetch all branches for mike
          git fetch origin gh-pages --depth=1 || true

          # Version detection
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            mike deploy --push --update-aliases $VERSION latest
            mike set-default --push latest
          else
            mike deploy --push --update-aliases dev
          fi

      - name: Build Documentation (Verification)
        if: github.event_name == 'pull_request'
        run: |
          mkdocs build --strict
