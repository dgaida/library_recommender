# .github/workflows/tests.yml
name: Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'pytest.ini'
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - 'docs/**'
      - '**.rst'
      - '.github/workflows/tests.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/codeql.yml'
      - '.github/workflows/lint.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'pytest.ini'
  workflow_dispatch:
    inputs:
      full_test:
        description: 'Run full test matrix'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Conditional matrix based on event type
        # Quick tests: ubuntu-latest + Python 3.11 only
        # Full tests: all OS and all Python versions
        os: >-
          ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.full_test == 'true'
                || contains(github.event.head_commit.message, '[full-test]')
                || contains(github.event.head_commit.message, '[full ci]'))
              && fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]')
              || fromJSON('["ubuntu-latest"]') }}
        python-version: >-
          ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.full_test == 'true'
                || contains(github.event.head_commit.message, '[full-test]')
                || contains(github.event.head_commit.message, '[full ci]'))
              && fromJSON('["3.9", "3.10", "3.11", "3.12"]')
              || fromJSON('["3.11"]') }}
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Display test mode
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]] || \
            [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.full_test }}" == "true" ]] || \
            [[ "${{ contains(github.event.head_commit.message, '[full-test]') }}" == "true" ]] || \
            [[ "${{ contains(github.event.head_commit.message, '[full ci]') }}" == "true" ]]; then
            echo "🔥 Running FULL test suite on all platforms"
          else
            echo "⚡ Running QUICK tests (ubuntu-latest, Python 3.11 only)"
          fi
        shell: bash

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-mock requests-mock flake8 black

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=. --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Check code formatting with Black
        run: |
          black --check .
        continue-on-error: true

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        continue-on-error: true
