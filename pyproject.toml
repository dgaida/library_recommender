[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "library_recommender"
version = "2.2.8"
description = "Intelligente Empfehlungs-App für die Stadtbibliothek Köln"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["bibliothek", "library", "empfehlungen", "recommendations", "köln"]
authors = [
    {name = "dgaida", email = "daniel.gaida@th-koeln.de"}
]
maintainers = [
    {name = "dgaida", email = "daniel.gaida@th-koeln.de"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Utilities",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Natural Language :: German",
]

dependencies = [
    "gradio>=4.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "ddgs>=9.0.0",
    "groq>=0.4.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.4.0",
    "mkdocstrings[python]>=0.23.0",
    "mkdocs-static-i18n>=1.2.0",
    "mkdocs-mermaid2-plugin>=0.6.0",
    "mike>=2.0.0",
    "interrogate>=1.5.0",
]

[tool.interrogate]
ignore-init-method = true
ignore-init-module = false
ignore-magic = false
ignore-semiprivate = false
ignore-private = false
ignore-property-decorators = false
ignore-module = false
ignore-nested-functions = false
fail-under = 95
exclude = ["setup.py", "docs", "build", "tests", "venv", ".tox"]
ignore-regex = ["^get$", "^mock_.*", ".*Base$"]
verbose = 2
quiet = false
whitelist-regex = []
color = true
omit-covered-files = false
generate-badge = "."
badge-format = "svg"

[project.urls]
Homepage = "https://github.com/dgaida/library_recommender"
Documentation = "https://github.com/dgaida/library_recommender#readme"
Repository = "https://github.com/dgaida/library_recommender"
"Bug Tracker" = "https://github.com/dgaida/library_recommender/issues"
Changelog = "https://github.com/dgaida/library_recommender/blob/main/CHANGELOG.md"

[project.scripts]
library_recommender = "main:main"

[tool.setuptools]
packages = ["data_sources", "gui", "library", "preprocessing", "recommender", "utils"]

[tool.black]
line-length = 127
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.venv
  | venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.coverage.run]
omit = [
    "tests/*",
    "setup.py",
    "version.py",
    "gui/*",
    "main.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
